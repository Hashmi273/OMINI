<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e6eaf1;--text:#182235;--muted:#71809a;--primary:#2563eb;--dark:#111827;--green:#059669;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:13px}
button,input,select{font:inherit}.app{display:flex;min-height:100vh}.sidebar{width:258px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;overflow:auto;z-index:20}.brand{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:11px}.brand img{width:42px;height:42px;object-fit:contain}.brand strong{display:block;font-size:15px;letter-spacing:-.3px}.brand small{display:block;color:#8a96aa;font-size:8px;font-weight:700;letter-spacing:.8px;margin-top:3px}.section{padding:18px 14px 4px;color:#9aa5b7;font-size:9px;font-weight:800;letter-spacing:1px}.nav{padding:4px 10px 10px}.nav button{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#52627b;font-weight:600;text-align:left;cursor:pointer;margin:2px 0}.nav button:hover{background:#f4f7fb;color:#1d4ed8}.nav button.active{background:#eef4ff;color:#1d4ed8}.nav .ico{width:18px;text-align:center;color:#71809a}.nav button.active .ico{color:#2563eb}.sub{display:none;padding:2px 0 6px 40px}.sub.open{display:block}.sub button{font-size:12px;padding:8px 10px}.main{margin-left:258px;width:calc(100% - 258px);min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.crumb-title{font-size:15px;font-weight:700}.search{width:360px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;padding:10px 13px;outline:0}.profile{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}.avatar{width:32px;height:32px;border-radius:50%;background:#eef2ff;color:#4338ca;display:grid;place-items:center;font-weight:800}.content{padding:26px 30px 40px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.eyebrow{color:#8b98ad;font-size:11px;font-weight:600}.page-title{font-size:26px;font-weight:800;letter-spacing:-.7px;margin:4px 0}.desc{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:#334155;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.btn:hover{background:#f8fafc}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:#b91c1c}.btn.success{background:#059669;border-color:#059669;color:#fff}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(15,23,42,.035)}.kpi{padding:17px}.kpi-label{font-size:10px;color:#8a97ab;font-weight:800;text-transform:uppercase}.kpi-value{font-size:23px;font-weight:800;margin-top:6px}.kpi-note{font-size:10px;color:#7a879a;margin-top:5px}.dashboard-grid{grid-template-columns:1.35fr 1fr}.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-title{font-size:14px;font-weight:800}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{background:#f8fafc;color:#7b889d;text-transform:uppercase;font-size:9px;letter-spacing:.5px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}.table td{padding:12px;border-bottom:1px solid #eef1f5;white-space:nowrap}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.green{background:#e9f9f2;color:#047857}.red{background:#fef0f0;color:#b91c1c}.amber{background:#fff7e6;color:#b45309}.blue{background:#edf4ff;color:#1d4ed8}.gray{background:#f1f5f9;color:#64748b}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.input,.select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:0;min-width:160px}.switch{width:42px;height:23px;border-radius:20px;background:#cbd5e1;padding:3px;cursor:pointer;display:inline-flex;justify-content:flex-start}.switch.on{background:#2563eb;justify-content:flex-end}.switch span{width:17px;height:17px;border-radius:50%;background:#fff;display:block}.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.online{background:#10b981}.warn{background:#f59e0b}.off{background:#94a3b8}.action-row{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:45px;text-align:center;color:#8793a7}.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal-bg.show{display:flex}.modal{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 25px 70px rgba(15,23,42,.2)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:10px;text-transform:uppercase;color:#71809a;font-weight:800;margin-bottom:6px}.field.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.check{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.check label{display:flex;align-items:center;gap:7px;font-weight:700}.toast{position:fixed;right:24px;bottom:24px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:200;box-shadow:0 12px 35px rgba(15,23,42,.25)}.toast.show{display:block}.mini{font-size:11px;color:#8a97ab}.progress{height:7px;background:#eef2f7;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#2563eb;border-radius:20px}.mobile-menu{display:none}
@media(max-width:1000px){.sidebar{width:228px}.main{margin-left:228px;width:calc(100% - 228px)}.kpis{grid-template-columns:repeat(3,1fr)}.dashboard-grid{grid-template-columns:1fr}.search{width:240px}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s;width:280px}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.mobile-menu{display:block;border:0;background:#fff;font-size:20px}.topbar{padding:0 15px}.topbar .search{display:none}.content{padding:20px 15px}.kpis{grid-template-columns:1fr 1fr}.page-head{gap:15px}.checks,.form-grid{grid-template-columns:1fr 1fr}.overlay{display:none}.overlay.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:15}}

<body>
<div class="app">

<div class="modal-bg" id="modalBg"><div class="modal"><div class="modal-head"><strong id="modalTitle">Action</strong><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast">Action completed</div>
<script>
const users=[
{id:'USR-1001',company:'ABC Pvt Ltd',name:'Aakash Verma',email:'aakash@abc.com',mobile:'+91 98XXXXXX21',role:'User',products:['SMS','RCS'],credit:'₹2,48,500',status:'Active',login:'Today, 11:42 AM',manager:'Parvez'},
{id:'USR-1002',company:'XYZ Communications',name:'Rahul Shah',email:'rahul@xyz.com',mobile:'+91 99XXXXXX42',role:'Reseller User',products:['SMS','WhatsApp'],credit:'₹1,82,000',status:'Active',login:'Today, 10:18 AM',manager:'Neha'},
{id:'USR-1003',company:'Metro Digital',name:'Sana Khan',email:'sana@metro.com',mobile:'+91 97XXXXXX11',role:'User',products:['RCS'],credit:'₹64,500',status:'Suspended',login:'18 Sep 2026',manager:'Parvez'}
];
const gateways=[['Airtel','SMS','CONNECTED','500 TPS'],['Jio','SMS','CONNECTED','450 TPS'],['Vi','SMS','WARNING','300 TPS'],['Smartping','SMS','CONNECTED','700 TPS'],['RCS Provider','RCS','CONNECTED','500 msg/sec'],['WhatsApp Provider','WhatsApp','CONNECTED','Healthy']];
const titles={dashboard:'Admin Dashboard',users:'User Management',resellers:'Reseller Management','create-user':'Create User','create-reseller':'Create Reseller',roles:'Roles & Permissions',products:'Product Access',billing:'Credit & Billing','billing-audit':'Billing Audit',transactions:'Transactions',smpp:'SMPP Accounts','smpp-gateways':'SMPP Gateways',gateways:'Gateway Management','rcs-connections':'RCS Connections','wa-connections':'WhatsApp Connections',reports:'Admin Reports',errors:'Error Code Management',tariffs:'Tariff & Pricing',whitelabel:'Reseller White Label',audit:'Audit Logs',settings:'System Settings'};
const content=document.getElementById('content'), topTitle=document.getElementById('topTitle');
function esc(v){return String(v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function head(title,desc,action=''){return '<div class="page-head"><div><div class="eyebrow">IMMENSE SMART SOLUTIONS · ADMIN</div><div class="page-title">'+title+'</div><div class="desc">'+desc+'</div></div>'+action+'</div>'}
function k(label,value,note){return '<div class="card kpi"><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div><div class="kpi-note">'+note+'</div></div>'}
function badge(s){let c=s==='Active'||s==='CONNECTED'||s==='Approved'||s==='Completed'?'green':s==='WARNING'||s==='Pending'||s==='Under Review'?'amber':s==='Suspended'||s==='DISCONNECTED'||s==='Rejected'?'red':'gray';return '<span class="badge '+c+'">'+s+'</span>'}
function renderDashboard(){
  content.innerHTML =
    head('Admin Dashboard','Central control center for users, credit, products, gateways and operations.',
      '<button class="btn primary" onclick="go(\\'create-user\\')">＋ Create User</button>') +
    '<div class="grid kpis">' +
      k('Total Users','1,248','↑ 6.2% this month') +
      k('Total Resellers','86','4 pending setup') +
      k('Active Users','1,104','88.5% of accounts') +
      k('Total Credit','₹48.50 L','Across all accounts') +
      k("Today\'s Recharge",'₹7.85 L','32 transactions') +
      k("Today\'s Usage",'₹3.42 L','SMS + RCS + WhatsApp') +
      k('SMPP Connections','18 / 21','3 pending') +
      k('RCS Connections','8 / 9','1 warning') +
      k('WhatsApp Connections','12 / 13','1 pending') +
    '</div>' +
    '<div class="grid dashboard-grid" style="margin-top:16px">' +
      '<div class="card panel"><div class="panel-head"><div class="panel-title">Gateway Status</div><button class="btn" onclick="go(\\'gateways\\')">Manage</button></div>' +
      gateways.map(g => '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef1f5"><div><strong>'+esc(g[0])+'</strong><div class="mini">'+esc(g[1])+' · '+esc(g[3])+'</div></div>'+badge(g[2])+'</div>').join('') +
      '</div>' +
      '<div class="card panel"><div class="panel-head"><div class="panel-title">Pending Actions</div><span class="badge amber">9</span></div>' +
      ['Pending Recharge Approvals','New User Requests','SMPP Requests','Gateway Issues','Audit Pending','Connection Issues'].map((x,i) =>
        '<div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eef1f5"><span>'+esc(x)+'</span><strong>'+(i%3+1)+'</strong></div>'
      ).join('') +
      '</div></div>' +
    '<div class="card panel" style="margin-top:16px"><div class="panel-head"><div class="panel-title">Recent Admin Activity</div><button class="btn" onclick="go(\\'audit\\')">View Audit</button></div>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Module</th><th>Status</th></tr></thead><tbody>' +
      [['14:32','Parvez','Added ₹50,000 credit','Billing','Completed'],['14:28','Parvez','Enabled RCS access','Product Access','Completed'],['14:21','Neha','Created SMPP account','SMPP','Completed'],['14:15','Parvez','Switched WhatsApp connection','Gateway','Completed']].map(row =>
        '<tr>'+row.map((x,j)=>'<td>'+((j===4)?badge(x):esc(x))+'</td>').join('')+'</tr>'
      ).join('') +
      '</tbody></table></div></div>';
}function renderUsers(){content.innerHTML=head('Users','Manage user accounts, product access, credit and operational permissions.','<button class="btn primary" onclick="go(\'create-user\')">＋ Create User</button>')+'<div class="card panel"><div class="toolbar"><input class="input" id="userSearch" placeholder="Search company, name, email..." oninput="filterUsers()"><select class="select"><option>All Roles</option><option>User</option><option>Reseller User</option></select><select class="select"><option>All Status</option><option>Active</option><option>Suspended</option></select><button class="btn">Export</button></div><div class="table-wrap"><table class="table" id="userTable"><thead><tr><th>User ID</th><th>Company</th><th>Name</th><th>Role</th><th>Products</th><th>Credit</th><th>Status</th><th>Last Login</th><th>Manager</th><th>Actions</th></tr></thead><tbody>'+users.map(u=>userRow(u)).join('')+'</tbody></table></div></div>'}
function userRow(u){return '<tr><td>'+u.id+'</td><td><strong>'+u.company+'</strong><div class="mini">'+u.email+'</div></td><td>'+u.name+'<div class="mini">'+u.mobile+'</div></td><td>'+u.role+'</td><td>'+u.products.map(x=>'<span class="badge blue" style="margin-right:3px">'+x+'</span>').join('')+'</td><td><strong>'+u.credit+'</strong></td><td>'+badge(u.status)+'</td><td>'+u.login+'</td><td>'+u.manager+'</td><td><div class="action-row"><button class="btn" onclick="viewUser(\''+u.id+'\')">View</button><button class="btn" onclick="creditUser(\''+u.company+'\')">Credit</button></div></td></tr>'}
function filterUsers(){let q=(document.getElementById('userSearch').value||'').toLowerCase();document.querySelector('#userTable tbody').innerHTML=users.filter(u=>Object.values(u).join(' ').toLowerCase().includes(q)).map(userRow).join('')}
function viewUser(id){const u=users.find(x=>x.id===id);openModal('User Details — '+u.company,'<div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">'+[['User ID',u.id],['Company',u.company],['Contact',u.name],['Email',u.email],['Role',u.role],['Products',u.products.join(', ')],['Credit',u.credit],['Status',u.status],['Account Manager',u.manager],['Last Login',u.login]].map(x=>'<div class="card panel"><div class="mini">'+x[0]+'</div><strong>'+x[1]+'</strong></div>').join('')+'</div><div style="margin-top:16px" class="action-row"><button class="btn primary" onclick="toast(\'Product access drawer opened\');closeModal()">Manage Products</button><button class="btn" onclick="creditUser(\''+u.company+'\')">Add Credit</button><button class="btn danger" onclick="toast(\'User suspension simulated\');closeModal()">Suspend</button></div>')}
function creditUser(name){openModal('Add Credit — '+name,'<div class="form-grid"><div class="field"><label>Amount</label><input class="input" style="width:100%" placeholder="₹ 0.00"></div><div class="field"><label>Payment Reference</label><input class="input" style="width:100%" placeholder="UTR / Reference"></div><div class="field full"><label>Remarks</label><input class="input" style="width:100%" placeholder="Reason / notes"></div></div><div style="margin-top:18px;text-align:right"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn success" onclick="closeModal();toast(\'Credit added successfully — demo only\')">Confirm Credit</button></div>')}
function renderForm(kind){const reseller=kind==='create-reseller';content.innerHTML=head(reseller?'Create Reseller':'Create User',reseller?'Create a reseller account and configure its commercial access.':'Create a customer account with product, API and billing access.')+'<div class="card panel"><div class="form-grid">'+[['Company Name','Example Communications'],[reseller?'Reseller Name':'Contact Person',reseller?'Aakash Verma':'Aakash Verma'],['Email','admin@example.com'],['Mobile','+91 98XXXXXXXX'],['Username','example_admin'],['Password','••••••••'],['Account Manager','Parvez'],['Role',reseller?'Reseller':'User'],['Status','Active']].map(x=>'<div class="field"><label>'+x[0]+'</label><input class="input" style="width:100%" value="'+x[1]+'"></div>').join('')+'<div class="field full"><label>Product Access</label><div class="checks">'+['SMS','RCS','WhatsApp','OBD','IVR'].map(x=>'<div class="check"><label><input type="checkbox" checked> '+x+'</label></div>').join('')+'</div></div><div class="field full"><label>API Access</label><div class="checks" style="grid-template-columns:repeat(3,1fr)">'+['SMS API','RCS API','WhatsApp API'].map(x=>'<div class="check"><label><input type="checkbox" checked> '+x+'</label></div>').join('')+'</div></div><div class="field"><label>SMPP</label><div class="check"><label><input type="checkbox"> Enable SMPP</label></div></div><div class="field"><label>Credit Limit</label><input class="input" style="width:100%" value="₹ 5,00,000"></div><div class="field full"><label>Rate Plan</label><select class="select" style="width:100%"><option>Standard Enterprise</option><option>Reseller Premium</option><option>Custom</option></select></div></div><div style="margin-top:20px;text-align:right"><button class="btn" onclick="go('users')">Cancel</button> <button class="btn primary" onclick="toast('Account created successfully — frontend demo');go('users')">Create & Continue</button></div></div>')}
function renderGeneric(page){const configs={resellers:['Reseller Management','Manage reseller hierarchy, credit, products and white-label access.','＋ Create Reseller'],roles:['Roles & Permissions','Configure the admin permission matrix for different operational roles.','＋ Create Role'],products:['Product Access','Control exactly which products and APIs each customer account can access.',''],billing:['Credit & Billing','Manage balances, additions, deductions, transfers and recharge activity.','＋ Add Credit'], 'billing-audit':['Billing Audit','Review recharge approvals and ensure every credit movement has an audit trail.',''],transactions:['Transactions','View all credit, recharge, deduction and transfer transactions.',''],smpp:['SMPP Accounts','Manage customer SMPP accounts, bindings, TPS and access.','＋ Create SMPP Account'],'smpp-gateways':['SMPP Gateways','Manage operator and upstream SMPP gateway connections.','＋ Add Gateway'],gateways:['Gateway Management','Monitor SMS, SMPP, RCS and WhatsApp connection health.','＋ Add Gateway'],'rcs-connections':['RCS Connections','Manage providers, agents, senders and connection switching.','＋ Add Connection'],'wa-connections':['WhatsApp Connections','Manage WABA accounts, phone numbers and provider connections.','＋ Add Connection'],reports:['Admin Reports','Unified reporting across users, resellers, products, gateways and error codes.','Export'],errors:['Error Code Management','Manage the operator/gateway error code database and mappings.','＋ Add Error Code'],tariffs:['Tariff & Pricing','Configure product, route, operator, user and reseller rates.','＋ Add Rate'],whitelabel:['Reseller White Label','Configure brand, URL, logo, colors and login branding for resellers.','Save Branding'],audit:['Audit Logs','Complete admin activity timeline with old/new values and status.','Export'],settings:['System Settings','Configure platform-level security, notifications and system preferences.','Save Changes']};let c=configs[page]||configs.dashboard;content.innerHTML=head(c[0],c[1],c[2]?'<button class="btn primary" onclick="demoAction(\''+c[0]+'\')">'+c[2]+'</button>':'')+moduleBody(page,c[0]);}

if(page==='whitelabel')return '<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card panel"><div class="form-grid">'+[['Brand Name','Example Communications'],['Custom URL','panel.example.com'],['Primary Color','#2563EB'],['Secondary Color','#FFFFFF']].map(x=>'<div class="field"><label>'+x[0]+'</label><input class="input" style="width:100%" value="'+x[1]+'"></div>').join('')+'<div class="field full"><label>Logo</label><input type="file" class="input" style="width:100%"></div><div class="field full"><label>Login Background</label><input type="file" class="input" style="width:100%"></div><div class="field full"><label>Powered By</label><div class="check"><label><input type="checkbox" checked> Show “Powered By”</label></div></div></div></div><div class="card panel"><div class="panel-title">Live Login Preview</div><div style="margin-top:15px;border:1px solid var(--line);border-radius:12px;padding:25px;background:#f8fafc;text-align:center"><div class="avatar" style="margin:auto">E</div><h3>Example Communications</h3><input class="input" style="width:100%;margin:6px 0" placeholder="Username"><input class="input" style="width:100%;margin:6px 0" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px">Sign In</button></div></div>';
if(page==='roles')return '<div class="card panel"><div class="table-wrap"><table class="table"><thead><tr><th>Permission</th><th>Admin</th><th>Manager</th><th>Finance</th><th>Support</th></tr></thead><tbody>'+['Dashboard','Users','Credit Add','Credit Deduct','Reports','Gateway','SMPP','Settings','Audit'].map((x,i)=>'<tr><td><strong>'+x+'</strong></td>'+['Admin','Manager','Finance','Support'].map((r,j)=>'<td><div class="switch '+(i===0||j===0||((i===4||i===8)&&j<3)?'on':'')+'" onclick="this.classList.toggle(\'on\');toast(\'Permission updated — demo\')"><span></span></div></td>').join('')+'</tr>').join('')+'</tbody></table></div></div>';
if(page==='reports'||page==='errors'||page==='tariffs'||page==='audit'||page==='transactions'||page==='billing-audit')return '<div class="card panel"><div class="toolbar"><input class="input" placeholder="Search..."><select class="select"><option>All Status</option><option>Active</option><option>Pending</option><option>Completed</option></select><select class="select"><option>All Products</option><option>SMS</option><option>RCS</option><option>WhatsApp</option></select><button class="btn">Filter</button><button class="btn">Export</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Account / Module</th><th>Product</th><th>Amount / Count</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>'+Array.from({length:6},(_,i)=>'<tr><td>#'+(10021+i)+'</td><td><strong>'+['ABC Pvt Ltd','XYZ Communications','Metro Digital','Airtel Gateway','Zion Support','Smartping'][i]+'</strong><div class="mini">'+['User','Reseller','User','Gateway','RCS','SMS'][i]+'</div></td><td>'+['SMS','RCS','WhatsApp','SMPP','RCS','SMS'][i]+'</td><td>'+['₹50,000','18,420','7,820','500 TPS','4,820','5101'][i]+'</td><td>'+badge(['Approved','Pending','Completed','CONNECTED','Under Review','Rejected'][i])+'</td><td>22 Sep 2026</td><td><button class="btn" onclick="openModal(\'Details\',\'<p>Detailed frontend preview for this record.</p><button class=btn onclick=closeModal()>Close</button>\')">View</button></td></tr>').join('')+'</tbody></table></div></div>';
return '<div class="grid kpis">'+k('Primary Metric','1,248','Current demo state')+k('Active','1,104','Healthy accounts')+k('Pending','9','Needs attention')+k('Warnings','3','Review required')+k('Today','₹7.85 L','Current period')+'</div><div class="card panel" style="margin-top:16px"><div class="panel-head"><div class="panel-title">'+title+' Overview</div><button class="btn" onclick="demoAction(\''+title+'\')">Open Action</button></div><div class="empty">Clean enterprise workspace for '+title+'. Frontend interactions are simulated for developer handoff.</div></div>'}
function demoAction(name){openModal(name,'<div class="form-grid"><div class="field"><label>Name</label><input class="input" style="width:100%" placeholder="Enter name"></div><div class="field"><label>Status</label><select class="select" style="width:100%"><option>Active</option><option>Pending</option><option>Disabled</option></select></div><div class="field full"><label>Notes</label><input class="input" style="width:100%" placeholder="Demo notes"></div></div><div style="margin-top:18px;text-align:right"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="closeModal();toast(\''+name+' saved successfully — demo only\')">Save</button></div>')}
function go(page){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  topTitle.textContent=titles[page]||'Admin';
  try{
    if(page==='dashboard') renderDashboard();
    else if(page==='users') renderUsers();
    else if(page==='create-user'||page==='create-reseller') renderForm(page);
    else renderGeneric(page);
  }catch(err){
    console.error('Admin module error:',err);
    content.innerHTML=head(titles[page]||'Admin','The module could not be rendered.')+
      '<div class="card panel"><div class="panel-title">Module Error</div><p class="desc">This page failed to load. Other admin modules remain available.</p><button class="btn primary" onclick="go(\\'dashboard\\')">Back to Dashboard</button></div>';
    toast('Module load error — check browser console');
  }
  history.replaceState({},'', 'admin.html?view='+encodeURIComponent(page));
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.getElementById('mobileMenu').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')};
document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')};
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
const initial=new URLSearchParams(location.search).get('view')||'dashboard';go(initial);
</script>
