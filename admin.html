  window.saveAccountManager=function(){
    var name=(document.getElementById('amName').value||'').trim();
    var email=(document.getElementById('amEmail').value||'').trim();
    var status=document.getElementById('amStatus').value;
    if(!name||!email){toast('Name and email are required');return;}
    if(accountManagers.some(function(m){return m.email.toLowerCase()===email.toLowerCase();})){toast('This email is already registered');return;}
    var next=accountManagers.length+1;
    accountManagers.push({id:'AM-'+String(next).padStart(3,'0'),name:name,email:email,status:status});
    try{localStorage.setItem('omini_account_managers',JSON.stringify(accountManagers));}catch(e){}
    closeModal(); toast('Account Manager added successfully'); renderAccountManagers();
  };

  window.updateAccountManager=function(id){
    var m=accountManagers.find(function(x){return x.id===id;});
    if(!m)return;
    var oldName=m.name;
    var newName=(document.getElementById('amEditName').value||'').trim();
    var email=(document.getElementById('amEditEmail').value||'').trim();
    if(!newName||!email){toast('Name and email are required');return;}
    if(accountManagers.some(function(x){return x.id!==id&&x.email.toLowerCase()===email.toLowerCase();})){toast('This email is already registered');return;}
    m.name=newName;m.email=email;m.status=document.getElementById('amEditStatus').value;
    users.forEach(function(u){if(u.accountManager===oldName)u.accountManager=newName;});
    try{localStorage.setItem('omini_account_managers',JSON.stringify(accountManagers));localStorage.setItem('omini_admin_users',JSON.stringify(users));}catch(e){}
    closeModal();toast('Account Manager updated');renderAccountManagers();

  function renderSystemTariff(){
    var traffic=[
      {id:'USR-1001',client:'bluemdtx',type:'Client',submitted:11100,delivered:10371,failed:586,pending:143,xDropped:0},
      {id:'USR-1002',client:'Suyash',type:'Client',submitted:574,delivered:506,failed:67,pending:1,xDropped:0},
      {id:'USR-1003',client:'tiger1',type:'Client',submitted:98,delivered:96,failed:2,pending:0,xDropped:0},
      {id:'USR-1004',client:'digisms',type:'Client',submitted:2,delivered:2,failed:0,pending:0,xDropped:0}
    ];

    // Add managed users that do not yet have traffic rows.
    users.forEach(function(u){
      if(!traffic.some(function(x){return x.id===u.id;})){
        traffic.push({
          id:u.id,
          client:u.name || u.company || u.id,
          type:u.role==='Reseller'?'Reseller':'Client',
          submitted:0,delivered:0,failed:0,pending:0,xDropped:0
        });
      }
    });

    function n(v){return Number(v||0).toLocaleString('en-IN');}
    function success(row){
      return row.submitted ? ((row.delivered/row.submitted)*100).toFixed(1) : '0.0';
    }

    var html=head('System Traffic','Monitor message traffic for every managed client in a simple account-wise delivery table.',
      '<button class="btn" onclick="toast(\'Traffic report exported\')">Export</button>');

    html+='<div class="card panel">';
    html+='<div class="toolbar" style="justify-content:space-between">';
    html+='<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><input id="trafficSearch" class="input" placeholder="Search client..." style="min-width:260px"><select id="trafficType" class="select"><option value="">All Types</option><option value="Client">Client</option><option value="Reseller">Reseller</option></select></div>';
    html+='<div class="mini" id="trafficCount"></div>';
    html+='</div>';
    html+='<div class="table-wrap"><table class="table" style="min-width:1180px"><thead><tr><th>Client</th><th>Type</th><th>Submitted</th><th>Delivered</th><th>Failed</th><th>Pending</th><th>X-Dropped</th><th>Success %</th><th>Action</th></tr></thead><tbody id="trafficTable">';

    traffic.forEach(function(t){
      html+='<tr data-traffic-id="'+esc(t.id)+'">';
      html+='<td><strong>'+esc(t.client)+'</strong><div class="mini">'+esc(t.id)+'</div></td>';
      html+='<td><span class="badge gray">'+esc(t.type)+'</span></td>';
      html+='<td>'+n(t.submitted)+'</td>';
      html+='<td>'+n(t.delivered)+'</td>';
      html+='<td>'+n(t.failed)+'</td>';
      html+='<td>'+n(t.pending)+'</td>';
      html+='<td>'+n(t.xDropped)+'</td>';
      html+='<td><strong>'+success(t)+'%</strong></td>';
      html+='<td><button class="btn" onclick="showTrafficClient(\''+esc(t.id)+'\')">Open</button></td>';
      html+='</tr>';
    });

    html+='</tbody></table></div>';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap"><div class="mini" id="trafficShowing"></div><div style="display:flex;align-items:center;gap:8px"><select class="select" id="trafficPageSize" style="min-width:118px;padding:7px 10px"><option value="50">50 / page</option><option value="25">25 / page</option><option value="100">100 / page</option></select><button class="btn" id="trafficPrev" disabled>Previous</button><span class="mini" id="trafficPageLabel">Page 1 of 1</span><button class="btn" id="trafficNext" disabled>Next</button></div></div>';
    html+='<div class="mini" style="margin-top:10px">Traffic columns follow the account-level delivery view: Submitted, Delivered, Failed, Pending, X-Dropped and Success %.</div>';
    html+='</div>';

    content.innerHTML=html;

    var search=document.getElementById('trafficSearch');
    var type=document.getElementById('trafficType');
    var pageSize=document.getElementById('trafficPageSize');
    var page=1;

    function filtered(){
      var q=(search.value||'').toLowerCase();
      var t=type.value;
      return traffic.filter(function(row){
        return (!q||(row.client+' '+row.id).toLowerCase().includes(q)) && (!t||row.type===t);
      });
    }

    function renderRows(){
      var rows=filtered();
      var size=Number(pageSize.value||50);
      var pages=Math.max(1,Math.ceil(rows.length/size));
      if(page>pages)page=pages;
      var start=(page-1)*size;
      var visible=rows.slice(start,start+size);
      var body=document.getElementById('trafficTable');
      body.innerHTML=visible.map(function(t){
        return '<tr><td><strong>'+esc(t.client)+'</strong><div class="mini">'+esc(t.id)+'</div></td><td><span class="badge gray">'+esc(t.type)+'</span></td><td>'+n(t.submitted)+'</td><td>'+n(t.delivered)+'</td><td>'+n(t.failed)+'</td><td>'+n(t.pending)+'</td><td>'+n(t.xDropped)+'</td><td><strong>'+success(t)+'%</strong></td><td><button class="btn" onclick="showTrafficClient(\''+esc(t.id)+'\')">Open</button></td></tr>';
      }).join('') || '<tr><td colspan="9" class="empty">No traffic found.</td></tr>';
      document.getElementById('trafficCount').textContent=rows.length+' client'+(rows.length===1?'':'s');
      document.getElementById('trafficShowing').textContent=rows.length ? 'Showing '+(start+1)+'–'+Math.min(start+visible.length,rows.length)+' of '+rows.length+' clients' : 'Showing 0 clients';
      document.getElementById('trafficPageLabel').textContent='Page '+page+' of '+pages;
      document.getElementById('trafficPrev').disabled=page<=1;
      document.getElementById('trafficNext').disabled=page>=pages;
    }

    search.addEventListener('input',function(){page=1;renderRows();});
    type.addEventListener('change',function(){page=1;renderRows();});
    pageSize.addEventListener('change',function(){page=1;renderRows();});
    document.getElementById('trafficPrev').addEventListener('click',function(){if(page>1){page--;renderRows();}});
    document.getElementById('trafficNext').addEventListener('click',function(){page++;renderRows();});
    renderRows();
  }

  function renderAdminSettings(){
    var settings=JSON.parse(localStorage.getItem('omini_admin_branding')||'null')||{company:'IMMENSE SMART SOLUTIONS',logo:'assets/immense-smart-solutions-logo.webp',primary:'#2563eb',accent:'#7c3aed',showBrand:true,showPowered:false};
    var html=head('Settings','Control the branding and appearance shown on the user panel.');
    html+='<div class="grid" style="grid-template-columns:1.25fr .75fr;gap:16px">';
    html+='<div class="card panel"><div class="panel-title">User Side Branding</div><div class="mini" style="margin:5px 0 16px">These settings define the visual identity displayed to managed users.</div><div class="form-grid">';
    html+='<label>Company / Brand Name<input id="brandCompany" class="input" value="'+esc(settings.company)+'"></label>';
    html+='<label>Logo URL<input id="brandLogo" class="input" value="'+esc(settings.logo)+'"></label>';
    html+='<label>Primary Color<input id="brandPrimary" class="input" type="color" value="'+esc(settings.primary)+'" style="height:40px;padding:4px"></label>';
    html+='<label>Accent Color<input id="brandAccent" class="input" type="color" value="'+esc(settings.accent)+'" style="height:40px;padding:4px"></label>';
    html+='<label class="check-card"><input id="brandShow" type="checkbox" '+(settings.showBrand?'checked':'')+'><span>Show brand name</span></label>';
    html+='<label class="check-card"><input id="brandPowered" type="checkbox" '+(settings.showPowered?'checked':'')+'><span>Show “Powered by” label</span></label>';
    html+='</div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn primary" onclick="saveBranding()">Save Branding</button></div></div>';
    html+='<div class="card panel"><div class="panel-title">Live Preview</div><div class="mini" style="margin:5px 0 14px">User panel preview</div><div style="border:1px solid #e5e9f0;border-radius:12px;overflow:hidden;background:#f7f9fc"><div style="height:50px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;gap:8px;padding:0 12px"><img id="brandPreviewLogo" src="'+esc(settings.logo)+'" style="width:28px;height:28px;object-fit:contain"><strong id="brandPreviewName">'+esc(settings.company)+'</strong></div><div style="padding:18px"><div style="height:8px;width:70%;background:#e8edf5;border-radius:8px;margin-bottom:12px"></div><div style="height:70px;background:#fff;border:1px solid #e5e9f0;border-radius:10px"></div></div></div></div>';
    html+='</div>';
    content.innerHTML=html;
  }
  window.saveBranding=function(){
    var settings={company:document.getElementById('brandCompany').value.trim(),logo:document.getElementById('brandLogo').value.trim(),primary:document.getElementById('brandPrimary').value,accent:document.getElementById('brandAccent').value,showBrand:document.getElementById('brandShow').checked,showPowered:document.getElementById('brandPowered').checked};
    localStorage.setItem('omini_admin_branding',JSON.stringify(settings));toast('User-side branding saved');renderAdminSettings();
  };

  function renderDevelopment(){
    var html=head('Development','Search a user by name or company and open the API integration details.',
      '<button class="btn primary" onclick="toast(\'API workspace ready\')">＋ New API Key</button>');
    html+='<div class="card panel"><div class="toolbar"><input id="devUserSearch" class="input" placeholder="Search user name, company or ID..." style="min-width:320px"><select id="devProduct" class="select"><option value="">All Products</option><option>SMS</option><option>RCS</option><option>WhatsApp</option><option>OBD</option><option>IVR</option></select></div>';
    html+='<div id="devResults"></div></div>';
    content.innerHTML=html;
    function renderResults(){
      var q=(document.getElementById('devUserSearch').value||'').toLowerCase(), p=document.getElementById('devProduct').value;
      var found=users.filter(function(u){
        return (!q||(u.name+' '+u.company+' '+u.id+' '+u.email).toLowerCase().includes(q)) && (!p||u.products.split(',').map(function(x){return x.trim();}).indexOf(p)>=0);
      });
      var box=document.getElementById('devResults');
      if(!found.length){box.innerHTML='<div class="empty">No matching user found.</div>';return;}
      box.innerHTML='<div style="display:grid;gap:10px">'+found.map(function(u){
        var key='omni_'+u.id.toLowerCase().replace(/[^a-z0-9]/g,'')+'_demo';
        var base='/api/v1';
        return '<div style="border:1px solid #e5e9f0;border-radius:12px;padding:14px;background:#fff"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><strong>'+esc(u.name)+'</strong><div class="mini">'+esc(u.company)+' · '+esc(u.email)+'</div></div><button class="btn" onclick="showUserApi(\''+u.id+'\')">View API</button></div><div class="mini" style="margin-top:8px">Products: '+esc(u.products)+' · Endpoint: '+base+'</div></div>';
      }).join('')+'</div>';
    }
    document.getElementById('devUserSearch').addEventListener('input',renderResults);
    document.getElementById('devProduct').addEventListener('change',renderResults);
    renderResults();
  }

  window.showUserApi=function(id){
    var u=users.find(function(x){return x.id===id;});if(!u)return;
    var safeId=u.id.toLowerCase().replace(/[^a-z0-9]/g,'');
    var body='<div class="profile-hero"><div class="profile-avatar">'+esc((u.name||u.company).charAt(0))+'</div><div><div class="profile-name">'+esc(u.name)+'</div><div class="mini">'+esc(u.company)+' · '+esc(u.products)+'</div></div></div>';
    body+='<div class="profile-grid">';
    body+='<div><span>API Base URL</span><strong>/api/v1</strong></div><div><span>Account ID</span><strong>'+esc(u.id)+'</strong></div>';
    body+='<div><span>SMS Endpoint</span><strong>/api/v1/sms/send</strong></div><div><span>RCS Endpoint</span><strong>/api/v1/rcs/send</strong></div>';
    body+='<div><span>WhatsApp Endpoint</span><strong>/api/v1/whatsapp/send</strong></div><div><span>API Key</span><strong>omni_'+esc(safeId)+'_demo</strong></div>';
    body+='</div><div class="mini" style="margin-top:12px">Demo integration details. Connect these fields to your real API credential store before production use.</div>';
    body+='<div style="text-align:right;margin-top:16px"><button class="btn" onclick="closeModal()">Close</button></div>';
    openModal('API Details — '+u.name,body);
  };

  function renderGeneric(page){
    var title=titles[page]||'Admin';
    var desc='Manage '+title.toLowerCase()+' from the central admin workspace.';
    var html=head(title,desc,'<button class="btn primary" onclick="toast(\'Action ready\')">＋ Add New</button>');
    if(['roles','products'].indexOf(page)>=0){
      html+='<div class="card panel"><div class="table-wrap"><table class="table"><thead><tr><th>Permission / Product</th><th>Admin</th><th>Manager</th><th>Finance</th><th>Support</th></tr></thead><tbody>';
      ['Dashboard','Users','Credit','Reports','Gateway','SMPP','RCS','WhatsApp','Settings','Audit'].forEach(function(x,i){
        html+='<tr><td><strong>'+x+'</strong></td>'+['Admin','Manager','Finance','Support'].map(function(){return '<td><button class="btn" onclick="this.classList.toggle(\'primary\')">Toggle</button></td>';}).join('')+'</tr>';
      });
      html+='</tbody></table></div></div>';
    }else{
      html+='<div class="grid kpis">'+k('Active','1,104','Current active records')+k('Pending','9','Needs attention')+k('Today','₹7.85 L','Current period')+k('Total','12,480','Total records')+'</div>';
      html+='<div class="card panel" style="margin-top:16px"><div class="panel-head"><div class="panel-title">'+title+' Records</div><div><button class="btn">Filter</button> <button class="btn">Export</button></div></div>';
      html+='<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Account / Module</th><th>Product</th><th>Value</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>';
      for(var i=0;i<6;i++)html+='<tr><td>#'+(10021+i)+'</td><td><strong>'+['ABC Pvt Ltd','XYZ Communications','Metro Digital','Airtel Gateway','Zion Support','Smartping'][i]+'</strong></td><td>'+['SMS','RCS','WhatsApp','SMPP','RCS','SMS'][i]+'</td><td>'+['₹50,000','18,420','7,820','500 TPS','4,820','5101'][i]+'</td><td>'+badge(['Approved','Pending','Completed','CONNECTED','Under Review','Rejected'][i])+'</td><td>22 Sep 2026</td><td><button class="btn" onclick="toast(\'Details opened\')">View</button></td></tr>';
      html+='</tbody></table></div></div>';
    }
    content.innerHTML=html;
  }

  window.go=function(page){
    if(!titles[page])page='dashboard';
    document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-page')===page);});
    topTitle.textContent=titles[page];
    try{
      if(page==='dashboard')renderDashboard();
      else if(page==='admin-users')renderAdminUsers();
      else if(page==='system-tariff')renderSystemTariff();
      else if(page==='configuration')renderConfiguration();
      else if(page==='admin-settings')renderAdminSettings();
      else if(page==='development')renderDevelopment();
      else if(page==='users')renderUsers();
      else if(page==='account-managers')renderAccountManagers();
      else if(page==='create-user'||page==='create-reseller')renderForm(page);
      else renderGeneric(page);
      history.replaceState({},'', 'admin.html?view='+encodeURIComponent(page));
    }catch(err){
      console.error(err);
      content.innerHTML=head(titles[page],'Module error')+'<div class="card panel"><div class="panel-title">Module Error</div><p class="desc">'+esc(err.message)+'</p></div>';
    }
  };

  document.querySelectorAll('.nav button').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-page'));});});
  var menu=document.getElementById('mobileMenu'), overlay=document.getElementById('overlay'), sidebar=document.getElementById('sidebar');
  if(menu)menu.onclick=function(){sidebar.classList.add('open');overlay.classList.add('show');};
  if(overlay)overlay.onclick=function(){sidebar.classList.remove('open');overlay.classList.remove('show');};
  var modalBg=document.getElementById('modalBg');
  if(modalBg)modalBg.addEventListener('click',function(e){if(e.target===modalBg)closeModal();});
  var initial=new URLSearchParams(location.search).get('view')||'dashboard';
  go(initial);
})();
</script>
</body>
</html>
