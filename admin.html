<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Immense Smart Solutions — Admin Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e6eaf1;--text:#182235;--muted:#71809a;--primary:#2563eb;--dark:#111827;--green:#059669;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:13px}
button,input,select{font:inherit}.app{display:flex;min-height:100vh}.sidebar{width:258px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;overflow:auto;z-index:20}.brand{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:11px}.brand img{width:42px;height:42px;object-fit:contain}.brand strong{display:block;font-size:15px;letter-spacing:-.3px}.brand small{display:block;color:#8a96aa;font-size:8px;font-weight:700;letter-spacing:.8px;margin-top:3px}.section{padding:18px 14px 4px;color:#9aa5b7;font-size:9px;font-weight:800;letter-spacing:1px}.nav{padding:4px 10px 10px}.nav button{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#52627b;font-weight:600;text-align:left;cursor:pointer;margin:2px 0}.nav button:hover{background:#f4f7fb;color:#1d4ed8}.nav button.active{background:#eef4ff;color:#1d4ed8}.nav .ico{width:18px;text-align:center;color:#71809a}.nav button.active .ico{color:#2563eb}.sub{display:none;padding:2px 0 6px 40px}.sub.open{display:block}.sub button{font-size:12px;padding:8px 10px}.main{margin-left:258px;width:calc(100% - 258px);min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.crumb-title{font-size:15px;font-weight:700}.search{width:360px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;padding:10px 13px;outline:0}.profile{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}.avatar{width:32px;height:32px;border-radius:50%;background:#eef2ff;color:#4338ca;display:grid;place-items:center;font-weight:800}.content{padding:26px 30px 40px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.eyebrow{color:#8b98ad;font-size:11px;font-weight:600}.page-title{font-size:26px;font-weight:800;letter-spacing:-.7px;margin:4px 0}.desc{color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:#334155;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}.btn:hover{background:#f8fafc}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:#b91c1c}.btn.success{background:#059669;border-color:#059669;color:#fff}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(15,23,42,.035)}.kpi{padding:17px}.kpi-label{font-size:10px;color:#8a97ab;font-weight:800;text-transform:uppercase}.kpi-value{font-size:23px;font-weight:800;margin-top:6px}.kpi-note{font-size:10px;color:#7a879a;margin-top:5px}.dashboard-grid{grid-template-columns:1.35fr 1fr}.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel-title{font-size:14px;font-weight:800}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th{background:#f8fafc;color:#7b889d;text-transform:uppercase;font-size:9px;letter-spacing:.5px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}.table td{padding:12px;border-bottom:1px solid #eef1f5;white-space:nowrap}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.green{background:#e9f9f2;color:#047857}.red{background:#fef0f0;color:#b91c1c}.amber{background:#fff7e6;color:#b45309}.blue{background:#edf4ff;color:#1d4ed8}.gray{background:#f1f5f9;color:#64748b}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.input,.select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:0;min-width:160px}.switch{width:42px;height:23px;border-radius:20px;background:#cbd5e1;padding:3px;cursor:pointer;display:inline-flex;justify-content:flex-start}.switch.on{background:#2563eb;justify-content:flex-end}.switch span{width:17px;height:17px;border-radius:50%;background:#fff;display:block}.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.online{background:#10b981}.warn{background:#f59e0b}.off{background:#94a3b8}.action-row{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:45px;text-align:center;color:#8793a7}.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.modal-bg.show{display:flex}.modal{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 25px 70px rgba(15,23,42,.2)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:10px;text-transform:uppercase;color:#71809a;font-weight:800;margin-bottom:6px}.field.full{grid-column:1/-1}.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.check{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.check label{display:flex;align-items:center;gap:7px;font-weight:700}.toast{position:fixed;right:24px;bottom:24px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:200;box-shadow:0 12px 35px rgba(15,23,42,.25)}.toast.show{display:block}.mini{font-size:11px;color:#8a97ab}.progress{height:7px;background:#eef2f7;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#2563eb;border-radius:20px}.mobile-menu{display:none}
@media(max-width:1000px){.sidebar{width:228px}.main{margin-left:228px;width:calc(100% - 228px)}.kpis{grid-template-columns:repeat(3,1fr)}.dashboard-grid{grid-template-columns:1fr}.search{width:240px}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s;width:280px}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.mobile-menu{display:block;border:0;background:#fff;font-size:20px}.topbar{padding:0 15px}.topbar .search{display:none}.content{padding:20px 15px}.kpis{grid-template-columns:1fr 1fr}.page-head{gap:15px}.checks,.form-grid{grid-template-columns:1fr 1fr}.overlay{display:none}.overlay.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:15}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/immense-smart-solutions-logo.webp" alt="Immense Smart Solutions"><div><strong>IMMENSE</strong><small>SMART SOLUTIONS · ADMIN</small></div></div>
  <div class="section">OVERVIEW</div><div class="nav"><button data-page="dashboard" class="active"><span class="ico">⌂</span>Dashboard</button></div>
  <div class="section">USER MANAGEMENT</div><div class="nav">
    <button data-page="users"><span class="ico">♙</span>Users</button><button data-page="resellers"><span class="ico">▣</span>Resellers</button><button data-page="create-user"><span class="ico">＋</span>Create User</button><button data-page="create-reseller"><span class="ico">＋</span>Create Reseller</button><button data-page="roles"><span class="ico">⚿</span>Roles & Permissions</button>
  </div>
  <div class="section">PRODUCT MANAGEMENT</div><div class="nav">
    <button data-page="products"><span class="ico">◈</span>Product Access</button>
  </div>
  <div class="section">CREDIT & BILLING</div><div class="nav">
    <button data-page="billing"><span class="ico">₹</span>Credit Dashboard</button><button data-page="billing-audit"><span class="ico">✓</span>Billing Audit</button><button data-page="transactions"><span class="ico">▤</span>Transactions</button>
  </div>
  <div class="section">SMPP MANAGEMENT</div><div class="nav">
    <button data-page="smpp"><span class="ico">⇄</span>SMPP Accounts</button><button data-page="smpp-gateways"><span class="ico">⌁</span>SMPP Gateways</button>
  </div>
  <div class="section">GATEWAYS & CONNECTIONS</div><div class="nav">
    <button data-page="gateways"><span class="ico">◉</span>Gateway Management</button><button data-page="rcs-connections"><span class="ico">◌</span>RCS Connections</button><button data-page="wa-connections"><span class="ico">◌</span>WhatsApp Connections</button>
  </div>
  <div class="section">REPORTS</div><div class="nav"><button data-page="reports"><span class="ico">▥</span>Reports</button></div>
  <div class="section">ERROR CODES</div><div class="nav"><button data-page="errors"><span class="ico">!</span>Error Code Management</button></div>
  <div class="section">TARIFF & PRICING</div><div class="nav"><button data-page="tariffs"><span class="ico">%</span>Tariffs & Pricing</button></div>
  <div class="section">WHITE LABEL</div><div class="nav"><button data-page="whitelabel"><span class="ico">◐</span>White Label</button></div>
  <div class="section">AUDIT</div><div class="nav"><button data-page="audit"><span class="ico">◷</span>Audit Logs</button></div>
  <div class="section">SYSTEM</div><div class="nav"><button data-page="settings"><span class="ico">⚙</span>System Settings</button></div>
</aside>
<div class="overlay" id="overlay"></div>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="mobileMenu">☰</button><span class="crumb-title" id="topTitle">Admin Dashboard</span></div><div style="display:flex;align-items:center;gap:12px"><input class="search" id="globalSearch" placeholder="Search users, gateways, reports..."><div class="profile"><div class="avatar">P</div><div><strong style="font-size:11px">Parvez</strong><div class="mini">Super Admin</div></div></div></div></header>
<section class="content" id="content"></section>
</main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal"><div class="modal-head"><strong id="modalTitle">Action</strong><button class="btn" onclick="closeModal()">✕</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast">Action completed</div>
<script>
(function(){
  var content=document.getElementById('content');
  var topTitle=document.getElementById('topTitle');
  var titles={
    dashboard:'Admin Dashboard',users:'User Management',resellers:'Reseller Management',
    'create-user':'Create User','create-reseller':'Create Reseller',roles:'Roles & Permissions',
    products:'Product Access',billing:'Credit & Billing','billing-audit':'Billing Audit',
    transactions:'Transactions',smpp:'SMPP Accounts','smpp-gateways':'SMPP Gateways',
    gateways:'Gateway Management','rcs-connections':'RCS Connections','wa-connections':'WhatsApp Connections',
    reports:'Admin Reports',errors:'Error Code Management',tariffs:'Tariff & Pricing',
    whitelabel:'Reseller White Label',audit:'Audit Logs',settings:'System Settings'
  };
  var users=[
    {id:'USR-1001',company:'ABC Pvt Ltd',name:'Aakash Verma',email:'aakash@abc.com',role:'User',products:'SMS, RCS',credit:'₹2,48,500',status:'Active'},
    {id:'USR-1002',company:'XYZ Communications',name:'Rahul Shah',email:'rahul@xyz.com',role:'Reseller User',products:'SMS, WhatsApp',credit:'₹1,82,000',status:'Active'},
    {id:'USR-1003',company:'Metro Digital',name:'Sana Khan',email:'sana@metro.com',role:'User',products:'RCS',credit:'₹64,500',status:'Suspended'}
  ];
  var gateways=[
    ['Airtel','SMS','CONNECTED','500 TPS'],['Jio','SMS','CONNECTED','450 TPS'],
    ['Vi','SMS','WARNING','300 TPS'],['Smartping','SMS','CONNECTED','700 TPS'],
    ['RCS Provider','RCS','CONNECTED','500 msg/sec'],['WhatsApp Provider','WhatsApp','CONNECTED','Healthy']
  ];

  function esc(v){
    return String(v).replace(/[&<>"]/g,function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
    });
  }
  function badge(s){
    var c=(s==='Active'||s==='CONNECTED'||s==='Approved'||s==='Completed')?'green':
      ((s==='WARNING'||s==='Pending'||s==='Under Review')?'amber':
      ((s==='Suspended'||s==='DISCONNECTED'||s==='Rejected')?'red':'gray'));
    return '<span class="badge '+c+'">'+esc(s)+'</span>';
  }
  function k(label,value,note){
    return '<div class="card kpi"><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+
      '</div><div class="kpi-note">'+note+'</div></div>';
  }
  function head(title,desc,action){
    return '<div class="page-head"><div><div class="eyebrow">IMMENSE SMART SOLUTIONS · ADMIN</div>'+
      '<div class="page-title">'+title+'</div><div class="desc">'+desc+'</div></div>'+
      (action||'')+'</div>';
  }
  function openModal(title,body){
    var bg=document.getElementById('modalBg');
    if(!bg)return;
    document.getElementById('modalTitle').textContent=title;
    document.getElementById('modalBody').innerHTML=body;
    bg.classList.add('show');
  }
  window.closeModal=function(){
    var bg=document.getElementById('modalBg');
    if(bg)bg.classList.remove('show');
  };
  window.toast=function(msg){
    var t=document.getElementById('toast');
    if(!t)return;
    t.textContent=msg;t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},1800);
  };

  function renderDashboard(){
    var gatewayUsage=[
      {gateway:'Airtel',sms:'420,500',rcs:'—',whatsapp:'—',total:'420,500'},
      {gateway:'Jio',sms:'310,200',rcs:'—',whatsapp:'—',total:'310,200'},
      {gateway:'Vi',sms:'87,300',rcs:'—',whatsapp:'—',total:'87,300'},
      {gateway:'Smartping',sms:'100,500',rcs:'—',whatsapp:'—',total:'100,500'},
      {gateway:'RCS Provider',sms:'—',rcs:'1,230,450',whatsapp:'—',total:'1,230,450'},
      {gateway:'WhatsApp Provider',sms:'—',rcs:'—',whatsapp:'457,420',total:'457,420'}
    ];

    var html=
      '<div class="page-head">'+
        '<div><div class="page-title">Dashboard</div><div class="desc">Simple overview of your SMS, RCS, WhatsApp, OBD and IVR activity.</div></div>'+
        '<div class="action-row"><select class="select" style="min-width:126px"><option>Today</option><option>Yesterday</option><option>This Month</option></select><button class="btn primary" onclick="go(\'reports\')">▥ Reports</button></div>'+
      '</div>';

    html+='<div class="grid kpis">';
    html+='<div class="card kpi"><div class="kpi-label">SMS Delivered</div><div class="kpi-value" style="color:#2563eb">918,500</div><div class="kpi-note">Today</div></div>';
    html+='<div class="card kpi"><div class="kpi-label">RCS Delivered</div><div class="kpi-value" style="color:#7c3aed">1,230,450</div><div class="kpi-note">Today</div></div>';
    html+='<div class="card kpi"><div class="kpi-label">WhatsApp Delivered</div><div class="kpi-value" style="color:#059669">457,420</div><div class="kpi-note">Today</div></div>';
    html+='<div class="card kpi"><div class="kpi-label">OBD Today</div><div class="kpi-value" style="color:#f4511e">18,230</div><div class="kpi-note">Calls delivered</div></div>';
    html+='<div class="card kpi"><div class="kpi-label">OBD Yesterday</div><div class="kpi-value" style="color:#f4511e">21,630</div><div class="kpi-note">Calls delivered</div></div>';
    html+='</div>';

        html+='<div class="card panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">Gateway-wise Message Usage</div><div class="mini">Today — messages sent through each configured gateway</div></div></div>';
    html+='<div class="table-wrap"><table class="table" style="min-width:720px"><thead><tr><th>Gateway</th><th>SMS Sent</th><th>RCS Sent</th><th>WhatsApp Sent</th><th>Total</th></tr></thead><tbody>';
    gatewayUsage.forEach(function(g){
      html+='<tr><td><strong>'+g.gateway+'</strong></td><td>'+g.sms+'</td><td>'+g.rcs+'</td><td>'+g.whatsapp+'</td><td><strong>'+g.total+'</strong></td></tr>';
    });
    html+='</tbody></table></div></div>';

    content.innerHTML=html;
  }

  function renderUsers(){
    var html=head('User Management','Manage user accounts, status, products and credit.',
      '<button class="btn primary" onclick="go(\'create-user\')">＋ Create User</button>');
    html+='<div class="card panel"><div class="toolbar"><input id="userSearch" class="input" placeholder="Search users..."><select class="select"><option>All Status</option><option>Active</option><option>Suspended</option></select><button class="btn">Export</button></div>';
    html+='<div class="table-wrap"><table class="table"><thead><tr><th>Account</th><th>Contact</th><th>Role</th><th>Products</th><th>Credit</th><th>Status</th><th>Action</th></tr></thead><tbody id="userTable">';
    users.forEach(function(u){html+='<tr><td><strong>'+esc(u.company)+'</strong><div class="mini">'+esc(u.id)+'</div></td><td>'+esc(u.name)+'<div class="mini">'+esc(u.email)+'</div></td><td>'+esc(u.role)+'</td><td>'+esc(u.products)+'</td><td>'+esc(u.credit)+'</td><td>'+badge(u.status)+'</td><td><button class="btn" onclick="viewUser(\''+u.id+'\')">View</button></td></tr>';});
    html+='</tbody></table></div></div>';
    content.innerHTML=html;
    var search=document.getElementById('userSearch');
    if(search)search.addEventListener('input',function(){
      var q=this.value.toLowerCase();
      document.querySelectorAll('#userTable tr').forEach(function(tr){tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none';});
    });
  }
  window.viewUser=function(id){
    var u=users.find(function(x){return x.id===id;});
    if(u)openModal('User Details','<div class="form-grid"><div><b>Company</b><p>'+esc(u.company)+'</p></div><div><b>Name</b><p>'+esc(u.name)+'</p></div><div><b>Role</b><p>'+esc(u.role)+'</p></div><div><b>Products</b><p>'+esc(u.products)+'</p></div><div><b>Credit</b><p>'+esc(u.credit)+'</p></div><div><b>Status</b><p>'+esc(u.status)+'</p></div></div><div style="text-align:right;margin-top:16px"><button class="btn" onclick="closeModal()">Close</button></div>');
  };

  function renderForm(type){
    var isReseller=type==='create-reseller';
    var title=isReseller?'Create Reseller':'Create User';
    content.innerHTML=head(title,isReseller?'Create a reseller account and configure its access.':'Create a user account and configure products and credit.');
    content.innerHTML+='<div class="card panel"><div class="form-grid">'+
      '<div class="field"><label>Company Name</label><input id="fCompany" class="input" placeholder="Company name"></div>'+
      '<div class="field"><label>Contact Name</label><input id="fName" class="input" placeholder="Full name"></div>'+
      '<div class="field"><label>Email</label><input class="input" placeholder="email@example.com"></div>'+
      '<div class="field"><label>Mobile</label><input class="input" placeholder="+91"></div>'+
      '<div class="field"><label>Account Role</label><select class="select"><option>'+(isReseller?'Reseller':'User')+'</option><option>Manager</option><option>Support</option></select></div>'+
      '<div class="field"><label>Status</label><select class="select"><option>Active</option><option>Pending</option></select></div>'+
      '<div class="field full"><label>Product Access</label><div class="check"><label><input type="checkbox" checked> SMS</label> <label><input type="checkbox" checked> RCS</label> <label><input type="checkbox"> WhatsApp</label> <label><input type="checkbox"> OBD</label> <label><input type="checkbox"> IVR</label></div></div>'+
      '<div class="field"><label>Opening Credit</label><input class="input" placeholder="₹0"></div>'+
      '<div class="field"><label>Account Manager</label><select class="select"><option>Parvez</option><option>Neha</option></select></div>'+
      '</div><div style="text-align:right;margin-top:18px"><button class="btn" onclick="go(\'dashboard\')">Cancel</button> <button class="btn primary" onclick="toast(\''+title+' created — demo\')">Create</button></div></div>';
  }

  function renderGeneric(page){
    var title=titles[page]||'Admin';
    var desc='Manage '+title.toLowerCase()+' from the central admin workspace.';
    var html=head(title,desc,'<button class="btn primary" onclick="toast(\'Action ready\')">＋ Add New</button>');
    if(['roles','products'].indexOf(page)>=0){
      html+='<div class="card panel"><div class="table-wrap"><table class="table"><thead><tr><th>Permission / Product</th><th>Admin</th><th>Manager</th><th>Finance</th><th>Support</th></tr></thead><tbody>';
      ['Dashboard','Users','Credit','Reports','Gateway','SMPP','RCS','WhatsApp','Settings','Audit'].forEach(function(x,i){
        html+='<tr><td><strong>'+x+'</strong></td>'+['Admin','Manager','Finance','Support'].map(function(){return '<td><button class="btn" onclick="this.classList.toggle(\'primary\')">Toggle</button></td>';}).join('')+'</tr>';
      });
      html+='</tbody></table></div></div>';
    }else{
      html+='<div class="grid kpis">'+k('Active','1,104','Current active records')+k('Pending','9','Needs attention')+k('Today','₹7.85 L','Current period')+k('Total','12,480','Total records')+'</div>';
      html+='<div class="card panel" style="margin-top:16px"><div class="panel-head"><div class="panel-title">'+title+' Records</div><div><button class="btn">Filter</button> <button class="btn">Export</button></div></div>';
      html+='<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Account / Module</th><th>Product</th><th>Value</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>';
      for(var i=0;i<6;i++)html+='<tr><td>#'+(10021+i)+'</td><td><strong>'+['ABC Pvt Ltd','XYZ Communications','Metro Digital','Airtel Gateway','Zion Support','Smartping'][i]+'</strong></td><td>'+['SMS','RCS','WhatsApp','SMPP','RCS','SMS'][i]+'</td><td>'+['₹50,000','18,420','7,820','500 TPS','4,820','5101'][i]+'</td><td>'+badge(['Approved','Pending','Completed','CONNECTED','Under Review','Rejected'][i])+'</td><td>22 Sep 2026</td><td><button class="btn" onclick="toast(\'Details opened\')">View</button></td></tr>';
      html+='</tbody></table></div></div>';
    }
    content.innerHTML=html;
  }

  window.go=function(page){
    if(!titles[page])page='dashboard';
    document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-page')===page);});
    topTitle.textContent=titles[page];
    try{
      if(page==='dashboard')renderDashboard();
      else if(page==='users')renderUsers();
      else if(page==='create-user'||page==='create-reseller')renderForm(page);
      else renderGeneric(page);
      history.replaceState({},'', 'admin.html?view='+encodeURIComponent(page));
    }catch(err){
      console.error(err);
      content.innerHTML=head(titles[page],'Module error')+'<div class="card panel"><div class="panel-title">Module Error</div><p class="desc">'+esc(err.message)+'</p></div>';
    }
  };

  document.querySelectorAll('.nav button').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-page'));});});
  var menu=document.getElementById('mobileMenu'), overlay=document.getElementById('overlay'), sidebar=document.getElementById('sidebar');
  if(menu)menu.onclick=function(){sidebar.classList.add('open');overlay.classList.add('show');};
  if(overlay)overlay.onclick=function(){sidebar.classList.remove('open');overlay.classList.remove('show');};
  var modalBg=document.getElementById('modalBg');
  if(modalBg)modalBg.addEventListener('click',function(e){if(e.target===modalBg)closeModal();});
  var initial=new URLSearchParams(location.search).get('view')||'dashboard';
  go(initial);
})();
</script>
</body>
</html>
